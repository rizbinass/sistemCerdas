<!DOCTYPE html>
<html>
<head>
    <title>Backward Chaining</title>
</head>
<body>

<h2>Backward Chaining Kredit</h2>

<button onclick="proses()">Proses</button>

<p id="hasil"></p>

<script>

function proses(){

    var skor_kredit = true;
    var riwayat_tunggakan = true;
    var penghasilan_tetap = true;
    var status_pekerjaan = true;
    var tabungan_aktif = true;

    var text = "";

    text += "Goal : kredit_disetujui <br><br>";

    text += "Cari kredit_disetujui... <br>";
    
    var nasabah_layak_kredit = false;

    text += "Butuh nasabah_layak_kredit <br><br>";



    var kategori_low_risk = false;
    var kemampuan_bayar_tinggi = false;

    text += "Cari kategori_low_risk... <br>";

    if(skor_kredit == true && riwayat_tunggakan == true){

        kategori_low_risk = true;

        text += "skor_kredit di atas 700 = TRUE <br>";
        text += "riwayat_tunggakan nol = TRUE <br>";
        text += "kategori_low_risk = TRUE <br><br>";

    }



    text += "Cari kemampuan_bayar_tinggi... <br>";

    var kondisi_ekonomi_stabil = false;
    var cadangan_dana_aman = false;

    if(penghasilan_tetap == true && status_pekerjaan == true){

        kondisi_ekonomi_stabil = true;

        text += "penghasilan_tetap = TRUE <br>";
        text += "status_pekerjaan tetap = TRUE <br>";
        text += "kondisi_ekonomi_stabil = TRUE <br><br>";

    }

    if(tabungan_aktif == true){

        cadangan_dana_aman = true;

        text += "tabungan_aktif tersedia = TRUE <br>";
        text += "cadangan_dana_aman = TRUE <br><br>";

    }

    if(kondisi_ekonomi_stabil == true && cadangan_dana_aman == true){

        kemampuan_bayar_tinggi = true;

        text += "kemampuan_bayar_tinggi = TRUE <br><br>";

    }



    if(kategori_low_risk == true && kemampuan_bayar_tinggi == true){

        nasabah_layak_kredit = true;

        text += "nasabah_layak_kredit = TRUE <br><br>";

    }



    if(nasabah_layak_kredit == true){

        text += "kredit_disetujui = TRUE <br><br>";
        text += "HASIL : KREDIT DISETUJUI";

    }else{

        text += "HASIL : KREDIT DITOLAK";

    }

    document.getElementById("hasil").innerHTML = text;

}

</script>

</body>
</html>
